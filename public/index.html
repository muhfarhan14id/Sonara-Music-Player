<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sonara – Musik dari YT Music</title>
  <meta name="description" content="Cari dan putar lagu dari YT Music. Bisa dipasang sebagai aplikasi, dengan cache offline untuk pencarian dan koleksi.">
  <meta name="theme-color" content="#1D1340">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sonara">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4.5c0 1.38-1.12 2.5-2.5 2.5S10 16.88 10 15.5s1.12-2.5 2.5-2.5c.57 0 1.08.19 1.5.51V7h5v4z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></symbol>
      <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
      <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
      <symbol id="i-queue" viewBox="0 0 24 24"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <header class="top">
      <h1 class="brand">Sonara</h1>
      <span id="net" class="net" hidden role="status">Offline</span>
      <button id="installBtn" class="pill" hidden>Pasang aplikasi</button>
    </header>

    <main>
      <section id="v-search" class="view">
        <form id="searchForm" class="searchbar" role="search" autocomplete="off">
          <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="q" name="q" type="search" placeholder="Cari lagu, artis, atau album" aria-label="Cari lagu" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
        </form>
        <ul id="suggest" class="suggest" hidden></ul>
        <p id="searchState" class="state" role="status" aria-live="polite"></p>
        <ul id="results" class="songs"></ul>
        <div id="home">
          <div id="recentBox" hidden>
            <div class="sec-head"><h2>Pencarian terakhir</h2><button id="clearRecent" class="link">Hapus</button></div>
            <div id="recent" class="chips"></div>
          </div>
          <div id="histBox" hidden>
            <div class="sec-head"><h2>Terakhir diputar</h2></div>
            <ul id="homeHist" class="songs"></ul>
          </div>
          <div id="homeEmpty" class="empty" hidden>
            <h2>Mulai dengan mencari lagu</h2>
            <p>Ketik judul atau nama artis di atas. Lagu yang kamu buka akan tersimpan agar bisa dicari lagi saat offline.</p>
          </div>
        </div>
      </section>

      <section id="v-library" class="view" hidden>
        <div id="libTabs" class="seg" role="tablist" aria-label="Pustaka">
          <button role="tab" data-tab="liked">Favorit</button>
          <button role="tab" data-tab="playlists">Playlist</button>
          <button role="tab" data-tab="saved">Tersimpan</button>
          <button role="tab" data-tab="history">Riwayat</button>
        </div>
        <div id="libHead"></div>
        <ul id="libList" class="songs"></ul>
        <div id="libExtra"></div>
      </section>
    </main>

    <div id="mini" class="mini" hidden>
      <button id="miniOpen" class="mini-main" aria-label="Buka pemutar">
        <img id="mCover" alt="" width="44" height="44">
        <span class="tx"><b id="mTitle"></b><small id="mArtist"></small></span>
      </button>
      <button id="mPlay" class="ib" aria-label="Putar"></button>
      <button id="mNext" class="ib" aria-label="Lagu berikutnya"><svg class="i"><use href="#i-next"/></svg></button>
      <i class="mbar"><i id="mFill"></i></i>
    </div>

    <nav class="tabs" aria-label="Navigasi utama">
      <button data-tab="search" aria-current="page"><svg class="i"><use href="#i-search"/></svg><span>Cari</span></button>
      <button data-tab="library"><svg class="i"><use href="#i-library"/></svg><span>Pustaka</span></button>
    </nav>
  </div>

  <section id="player" class="player" role="dialog" aria-modal="true" aria-label="Pemutar musik" hidden>
    <div class="p-top">
      <button id="pClose" class="ib" aria-label="Tutup pemutar"><svg class="i"><use href="#i-down"/></svg></button>
      <span class="p-label">Sedang diputar</span>
      <button id="pMore" class="ib" aria-label="Menu lagu"><svg class="i"><use href="#i-more"/></svg></button>
    </div>
    <div class="p-cover"><img id="pCover" alt="" width="544" height="544"></div>
    <div class="p-info">
      <h2 id="pTitle"></h2>
      <p id="pArtist"></p>
    </div>
    <div class="p-seek">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Posisi lagu">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="p-ctrl">
      <button id="pShuffle" class="ib" aria-label="Acak" aria-pressed="false"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button id="pPrev" class="ib" aria-label="Lagu sebelumnya"><svg class="i"><use href="#i-prev"/></svg></button>
      <button id="pPlay" class="big" aria-label="Putar"></button>
      <button id="pNext" class="ib" aria-label="Lagu berikutnya"><svg class="i"><use href="#i-next"/></svg></button>
      <button id="pRepeat" class="ib" aria-label="Ulangi: mati" aria-pressed="false"><svg class="i"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="p-sub">
      <button id="pLike" class="ib" aria-label="Tambah ke favorit" aria-pressed="false"></button>
      <button id="pSave" class="ib" aria-label="Simpan" aria-pressed="false"></button>
      <button id="pQueue" class="ib" aria-label="Antrean" aria-expanded="false"><svg class="i"><use href="#i-queue"/></svg></button>
    </div>
    <div id="queueBox" class="queue-box" hidden>
      <div class="sec-head"><h2>Antrean</h2></div>
      <ul id="queueList" class="songs"></ul>
    </div>
  </section>

  <div id="sheetBack" class="back" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Menu" hidden>
    <div id="sheetHead" class="sheet-head"></div>
    <div id="sheetBody"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="ytwrap" class="ytwrap" aria-hidden="true"><div id="yt"></div></div>

  <script src="/app.js" defer></script>
</body>
</html>
